name: "CI"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  typos:
    name: "📝 Check typos"
    if: always()
    uses: hrzlgnm/actions/.github/workflows/typos-reusable.yml@c4634c8090f9c2941bbad01a692e2dd4fc91416c # v2.14.10

  changes:
    name: "🔍 Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      bindings: ${{ steps.filter.outputs.bindings }}
      apk: ${{ steps.filter.outputs.apk }}
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-sccache/**'
            bindings:
              - 'guest-js/**'
              - 'package.json'
              - 'package-lock.json'
              - 'rollup.config.js'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
            apk:
              - 'android/**'
              - 'examples/api/**'
              - 'src/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'permissions/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/test-android.yml'

  fmt:
    name: "📐 fmt"
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt

      - name: 📐 Run rustfmt and fail if any warnings
        shell: bash
        run: cargo fmt -- --check

  clippy:
    name: "📎 clippy"
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy

      - name: 🧰 Install Tauri system dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: 📎 Run clippy and fail if any warnings
        shell: bash
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: "✅ test"
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy

      - name: 🧰 Install Tauri system dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: 🛠️🚀
        uses: ./.github/actions/setup-sccache

      - name: ✅ Run tests
        shell: bash
        run: cargo test

  bindings:
    name: "📦 bindings"
    needs: [changes]
    if: needs.changes.outputs.bindings == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📥 Install dependencies
        shell: bash
        run: npm ci

      - name: 🏗️ Build bindings
        shell: bash
        run: npm run build

  android:
    name: "🤖 android"
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
          targets: aarch64-linux-android

      - name: 🛠️🚀
        uses: ./.github/actions/setup-sccache

      # Desktop jobs never compile the `#[cfg(mobile)]` code, so
      # clippy the Android target to cover the mobile runtime path
      # (`src/mobile.rs`, `target_os = "android"`). No NDK or linker
      # is needed as clippy only checks; `-D warnings` keeps the
      # mobile path lint-clean like its desktop counterpart.
      - name: 🤖 Run clippy for the Android target and fail if any warnings
        shell: bash
        run: cargo clippy --target aarch64-linux-android --all-targets -- -D warnings

  android-apk:
    # Compiles the Android Kotlin via the example debug APK build;
    # see test-android.yml (mirrors tauri-apps/plugins-workspace).
    name: "🤖 android-apk"
    needs: [changes]
    if: needs.changes.outputs.apk == 'true'
    permissions:
      contents: read # needed for checkout in the called workflow
      actions: write # needed for sccache's GitHub cache backend
    uses: ./.github/workflows/test-android.yml

  all-required-green: # This job does nothing and is only used for the branch protection
    name: CI Status
    runs-on: ubuntu-latest
    needs:
      - changes
      - fmt
      - clippy
      - test
      - android
      - android-apk
      - bindings
      - typos
    if: always()
    steps:
      - name: Check whether the needed jobs succeeded or failed
        # No `# vN` comment: re-actors/alls-green publishes no versioned
        # releases, so the SHA pin is the whole pin.
        uses: re-actors/alls-green@a638d6464689bbb24c325bb3fe9404d63a913030
        with:
          jobs: ${{ toJSON(needs) }}
          # Every job gated by the `changes` outputs may legitimately
          # skip; `changes` and `typos` always run and must succeed.
          allowed-skips: >-
            fmt,
            clippy,
            test,
            android,
            android-apk,
            bindings
