# Compiles the Android Kotlin (plugin + example app) the same way
# official Tauri plugins do: `tauri android init` scaffolds the
# project (nothing under examples/api/src-tauri/gen is committed)
# and `tauri android build` compiles it into a debug APK.
# No build-artifact (target/, Gradle) caches on purpose, mirroring
# plugins-workspace. (The npm registry cache only speeds dependency
# download, so it stays.) sccache stays enabled for the Rust
# compilation inside `tauri android build` via the GitHub cache backend.
#
# Reusable workflow: called from the `android-apk` job in ci.yml so
# the APK build is part of the required CI Status check.

name: "test android"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: write # needed for sccache's GitHub cache backend

jobs:
  test:
    name: "🤖 build debug APK"
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 🛠️🚀
        uses: ./.github/actions/setup-sccache

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/api/package-lock.json

      - name: 📥 Install example dependencies
        shell: bash
        working-directory: examples/api
        run: npm ci

      - name: ☕ Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 25

      - name: 📱 Setup NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: r25

      # TODO check after https://github.com/nttld/setup-ndk/issues/518 is fixed
      - name: 🔗 Restore Android symlinks
        shell: bash
        env:
          NDK_HOST: linux-x86_64
        run: |
          directory="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/$NDK_HOST/bin"
          find "$directory" -type l | while IFS= read -r link; do
              current_target=$(readlink "$link")
              new_target="$directory/$(basename "$current_target")"
              ln -sf "$new_target" "$link"
              echo "Changed $(basename "$link") from $current_target to $new_target"
          done

      - name: 🏗️ Scaffold Android project
        # Via npx (not ./node_modules/.bin/tauri): init records how the
        # CLI was invoked into BuildTask.kt, and only the npx/npm form
        # resolves at Gradle build time. A direct binary call bakes in
        # `node tauri ...`, which fails with MODULE_NOT_FOUND.
        shell: bash
        working-directory: examples/api
        run: npx tauri android init

      - name: 🤖 Build debug APK
        shell: bash
        working-directory: examples/api
        run: ./node_modules/.bin/tauri android build --debug
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
